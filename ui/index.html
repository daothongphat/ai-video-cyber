    <script>
        const API_BASE = 'http://localhost:3000';
        const btn = document.getElementById('btnGenerate');
        const log = document.getElementById('statusLog');
        const prompt = document.getElementById('promptInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const durationInput = document.getElementById('durationInput');
        const templateSelect = document.getElementById('templateSelect');
        const statusBadge = document.getElementById('statusBadge');
        const videoPreview = document.getElementById('videoPreview');
        const previewVideo = document.getElementById('previewVideo');
        const backgroundSource = document.getElementById('backgroundSource');
        const urlInputGroup = document.getElementById('urlInputGroup');
        const backgroundUrl = document.getElementById('backgroundUrl');
        const aspectRatio = document.getElementById('aspectRatio');
        const resolution = document.getElementById('resolution');
        const fps = document.getElementById('fps');
        const useGemini = document.getElementById('useGemini');

        let currentJobId = null;
        let pollInterval = null;
        let currentMode = 'prompt';
        let lastLogMessage = '';

        const tabs = document.querySelectorAll('.mode-tab');
        const panelPrompt = document.getElementById('panelPrompt');
        const panelJson = document.getElementById('panelJson');
        const panelHtml = document.getElementById('panelHtml');
        const jsonInput = document.getElementById('jsonInput');
        const jsonStatus = document.getElementById('jsonStatus');
        const htmlInput = document.getElementById('htmlInput');
        const htmlStatus = document.getElementById('htmlStatus');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMode = tab.dataset.mode;
                panelPrompt.classList.toggle('active', currentMode === 'prompt');
                panelJson.classList.toggle('active', currentMode === 'json');
                panelHtml.classList.toggle('active', currentMode === 'html');
            });
        });

        const portraitInputGroup = document.getElementById('portraitInputGroup');
        const portraitPath = document.getElementById('portraitPath');

        backgroundSource.addEventListener('change', () => {
            urlInputGroup.style.display = backgroundSource.value === 'url' ? 'block' : 'none';
            portraitInputGroup.style.display = backgroundSource.value === 'omnihuman' ? 'block' : 'none';
        });

        function validateJson() {
            const text = jsonInput.value.trim();
            if (!text) { jsonStatus.textContent = ''; jsonStatus.className = 'json-status'; return null; }
            try {
                const parsed = JSON.parse(text);
                jsonStatus.textContent = 'JSON hÃ¡Â»Â£p lÃ¡Â»â€¡';
                jsonStatus.className = 'json-status valid';
                return parsed;
            } catch (err) {
                jsonStatus.textContent = err.message;
                jsonStatus.className = 'json-status invalid';
                return null;
            }
        }

        jsonInput.addEventListener('input', validateJson);

        function validateHtml() {
            const text = htmlInput.value.trim();
            if (!text) { htmlStatus.textContent = ''; htmlStatus.className = 'json-status'; return null; }
            const hasDoctype = text.includes('<!DOCTYPE') || text.includes('<html');
            const hasRoot = text.includes('data-composition-id');
            const hasTimeline = text.includes('window.__timelines');
            if (!hasDoctype) { htmlStatus.textContent = 'ThiÃ¡ÂºÂ¿u DOCTYPE'; htmlStatus.className = 'json-status invalid'; return null; }
            if (!hasRoot) { htmlStatus.textContent = 'ThiÃ¡ÂºÂ¿u data-composition-id'; htmlStatus.className = 'json-status invalid'; return null; }
            if (!hasTimeline) { htmlStatus.textContent = 'ThiÃ¡ÂºÂ¿u window.__timelines'; htmlStatus.className = 'json-status invalid'; return null; }
            htmlStatus.textContent = 'HTML hÃ¡Â»Â£p lÃ¡Â»â€¡';
            htmlStatus.className = 'json-status valid';
            return text;
        }

        htmlInput.addEventListener('input', validateHtml);
        document.getElementById('btnValidateHtml').addEventListener('click', validateHtml);
        document.getElementById('btnFormatJson').addEventListener('click', () => {
            const parsed = validateJson();
            if (parsed) { jsonInput.value = JSON.stringify(parsed, null, 2); validateJson(); }
        });

        document.getElementById('btnLoadTemplate').addEventListener('click', () => {
            const template = {
                scene_id: "cyber_custom",
                template_name: "cyber_security",
                template_version: "1.0",
                duration: 15.0,
                data: { title: "HÃ¡Â»â€  THÃ¡Â»ÂNG BÃ¡ÂºÂ¢O MÃ¡ÂºÂ¬T", subtitle: "MÃƒÆ’ HÃƒâ€œA Ã„ÂA TÃ¡ÂºÂ¦NG // GIÃƒÂM SÃƒÂT 24/7" }
            };
            jsonInput.value = JSON.stringify(template, null, 2);
            validateJson();
        });

        function addLog(message, type = 'info') {
            if (message === lastLogMessage) return;
            lastLogMessage = message;
            const time = new Date().toLocaleTimeString('vi-VN');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        document.getElementById('btnNewJob').addEventListener('click', () => {
            videoPreview.classList.remove('visible');
            previewVideo.src = '';
            log.innerHTML = '<div class="log-line"><span class="log-time">[SYSTEM]</span> <span class="log-info">Ready. Waiting for input...</span></div>';
            lastLogMessage = '';
        });

        btn.addEventListener('click', async () => {
            let payload = {
                voice: voiceSelect.value,
                duration: parseInt(durationInput.value),
                template: templateSelect.value,
                backgroundSource: backgroundSource.value,
                backgroundUrl: backgroundUrl.value,
                portraitPath: portraitPath.value,
                aspectRatio: aspectRatio.value,
                resolution: resolution.value,
                fps: parseInt(fps.value),
                useGemini: useGemini.checked
            };

            if (currentMode === 'json') {
                const parsed = validateJson();
                if (!parsed) { addLog('JSON khÃƒÂ´ng hÃ¡Â»Â£p lÃ¡Â»â€¡', 'warn'); return; }
                payload.sceneJson = parsed;
                addLog('Mode: JSON thÃ¡Â»Â§ cÃƒÂ´ng', 'info');
            } else if (currentMode === 'html') {
                const html = validateHtml();
                if (!html) { addLog('HTML khÃƒÂ´ng hÃ¡Â»Â£p lÃ¡Â»â€¡', 'warn'); return; }
                payload.customHtml = html;
                addLog('Mode: HTML thÃ¡Â»Â§ cÃƒÂ´ng', 'info');
            } else {
                const text = prompt.value.trim();
                if (!text) { addLog('Prompt trÃ¡Â»â€˜ng', 'warn'); return; }
                payload.prompt = text;
                addLog(useGemini.checked ? 'Mode: Gemini sinh HTML' : 'Mode: Prompt tÃ¡Â»Â± Ã„â€˜Ã¡Â»â„¢ng', 'info');
            }

            addLog('Initializing...', 'info');
            btn.disabled = true;
            btn.textContent = 'PROCESSING...';
            statusBadge.textContent = ' PROCESSING';
            statusBadge.style.color = '#ffcc00';

            try {
                const response = await fetch(`${API_BASE}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                const data = await response.json();
                currentJobId = data.jobId;
                addLog(`Job created: ${currentJobId}`, 'ok');
                pollInterval = setInterval(() => pollStatus(currentJobId), 2000);
            } catch (err) {
                addLog(`ERROR: ${err.message}`, 'error');
                btn.disabled = false;
                btn.textContent = 'GENERATE VIDEO';
                statusBadge.textContent = ' SYSTEM ONLINE';
                statusBadge.style.color = '#00ff64';
            }
        });

        async function pollStatus(jobId) {
            try {
                const response = await fetch(`${API_BASE}/api/status/${jobId}`);
                const data = await response.json();
                if (data.lastLog) addLog(data.lastLog, data.lastLogType || 'info');

                if (data.status === 'completed') {
                    clearInterval(pollInterval);
                    addLog(`Video ready: ${data.outputFile}`, 'ok');
                    btn.disabled = false;
                    btn.textContent = 'GENERATE VIDEO';
                    statusBadge.textContent = ' SYSTEM ONLINE';
                    statusBadge.style.color = '#00ff64';
                    videoPreview.classList.add('visible');
                    const videoUrl = `${API_BASE}/api/download/${jobId}?t=${Date.now()}`;
                    previewVideo.src = videoUrl;
                    const btnDownload = document.getElementById('btnDownload');
                    btnDownload.href = videoUrl;
                    btnDownload.setAttribute('download', data.outputFile || 'video.mp4');
                } else if (data.status === 'failed') {
                    clearInterval(pollInterval);
                    addLog(`ERROR: ${data.error}`, 'error');
                    btn.disabled = false;
                    btn.textContent = 'GENERATE VIDEO';
                    statusBadge.textContent = ' SYSTEM ONLINE';
                    statusBadge.style.color = '#00ff64';
                }
            } catch (err) {
                addLog(`Poll error: ${err.message}`, 'warn');
            }
        }
    </script>
</body>
