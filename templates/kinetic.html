<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0; padding: 0;
            width: {{width}}px; height: {{height}}px;
            background: transparent;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
        }
        .kinetic-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }
        .kinetic-word {
            font-size: 120px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-align: center;
            opacity: 0;
            transform: scale(0.5) translateY(40px);
            text-shadow: 0 0 30px rgba(0, 255, 100, 0.6);
        }
        .kinetic-sub {
            font-size: 32px;
            font-weight: 400;
            color: #00ff64;
            letter-spacing: 4px;
            margin-top: 30px;
            text-align: center;
            opacity: 0;
        }
        .kinetic-line {
            width: 0;
            height: 3px;
            background: #00ff64;
            margin-top: 25px;
            box-shadow: 0 0 15px #00ff64;
        }
    </style>
</head>
<body>
    <div id="root"
         data-composition-id="kinetic"
         data-start="0"
         data-duration="{{duration}}"
         data-width="{{width}}"
         data-height="{{height}}"
         class="clip">
        <div class="kinetic-wrap">
            <div class="kinetic-word" id="word">{{title}}</div>
            <div class="kinetic-line" id="line"></div>
            <div class="kinetic-sub" id="sub">{{subtitle}}</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const tl = gsap.timeline({ paused: true });
        tl.to("#word", { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "back.out(1.7)" }, 0);
        tl.to("#line", { width: "60%", duration: 0.6, ease: "power2.out" }, 0.5);
        tl.to("#sub", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.9);

        window.__timelines = window.__timelines || {};
        window.__timelines["kinetic"] = tl;
    </script>
</body>
</html>
